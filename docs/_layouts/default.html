<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=2' | relative_url }}">
</head>
<body>
  <div class="wrapper">
    <header class="site-header">
      <p class="site-title"><a href="{{ '/' | relative_url }}" style="border-bottom:none;color:inherit;">{{ site.title }}</a></p>
      <p class="site-description">{{ site.description }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="https://github.com/madhuri723/hydra-effect-refusal">Code</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      {{ site.description }} &middot; maintained by <a href="https://github.com/madhuri723">madhuri723</a>
    </footer>
  </div>
</body>
</html>
